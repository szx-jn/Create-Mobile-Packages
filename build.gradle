plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.hypherionmc.modutils.modpublisher' version '2.1.7'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
}

ext.buildNumber = System.getenv('BUILD_NUMBER')
ext.rawBranchName = System.getenv("BRANCH_NAME")
ext.branchName = rawBranchName ? rawBranchName.replaceAll("[^a-zA-Z0-9._-]", "_") : null

static def readLatestChangelogSection(File changelogFile) {
    if (!changelogFile.exists()) {
        throw new GradleException("CHANGELOG file not found: ${changelogFile.absolutePath}")
    }

    // Use readLines() directly which already handles line terminators efficiently
    def lines = changelogFile.readLines('UTF-8')
    def isSeparator = { String line -> line ==~ /^-{10,}\s*$/ }

    int firstSeparator = lines.findIndexOf { line -> isSeparator(line) }
    if (firstSeparator < 0) {
        throw new GradleException("No changelog separator line found in ${changelogFile.name}")
    }

    int secondSeparator = lines.findIndexOf(firstSeparator + 1) { String line -> isSeparator(line) }
    if (secondSeparator < 0) {
        throw new GradleException("Could not find the second separator line in ${changelogFile.name}")
    }

    int nextEntrySeparator = lines.findIndexOf(secondSeparator + 1) { String line -> isSeparator(line) }

    int endExclusive = nextEntrySeparator >= 0 ? nextEntrySeparator : lines.size()
    return lines.subList(firstSeparator, endExclusive).join('\n').trim()
}

def fullChangelogUrl = 'https://github.com/timplay33/Create-Mobile-Packages/blob/mc1.21.1/main/CHANGELOG.md'
// Lazy evaluation: only compute changelog when publisher task is executed
def latestChangelogForPublisher = providers.provider {
    readLatestChangelogSection(rootProject.file('CHANGELOG.md')) + "\n\nFull changelog: ${fullChangelogUrl}"
}

base {
    archivesName = "${mod_id}-${minecraft_version}"
    group = 'de.theidler.'+ mod_id
    def isMainBranch = rawBranchName == "mc1.21.1/main"
    version = mod_version + (!isMainBranch && buildNumber ? "-${buildNumber}" : '') + (!isMainBranch && branchName ? "-${branchName}" : '')
}


// Mojang ships Java 21 to end users starting in 1.20.5, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

neoForge {
    // Specify the version of NeoForge to use.
    enable { version = project.neo_version; disableRecompilation = true }




    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://mvn.devos.one/snapshots" } // Registrate
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // ForgeConfigAPIPort
    maven { url = "https://maven.blamejared.com/" } // JEI
    maven { url = "https://maven.terraformersmc.com/releases/" } // EMI
    maven { url = "https://dl.zznty.ru/maven" } // Create Factory Abstractions, Create Factory Logistics
    maven { url = "https://maven.theillusivec4.top/" } // Curios
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://cursemaven.com" }
    mavenCentral()
    flatDir {
        dirs "libs"
    }
}

dependencies {
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
    compileOnly "maven.modrinth:jei:kmb7KviL"
    compileOnly("dev.emi:emi-neoforge:${emi_version}:api")
    implementation(jarJar("ru.zznty:create_factory_abstractions-${minecraft_version}:${create_factory_abstractions_version}"))
    //runtimeOnly("ru.zznty:create_factory_logistics-${minecraft_version}:${create_factory_abstractions_version}")
    compileOnly("org.jetbrains:annotations:24.0.1")
    compileOnly("maven.modrinth:g4AWLVIr:QcUiaW4c")
    //runtimeOnly("maven.modrinth:g4AWLVIr:QcUiaW4c")

    // testing mod compatibilities
    implementation "maven.modrinth:curios:KJsZIQrT"
    implementation "maven.modrinth:mekanism:5KzzycBT"
    compileOnly "maven.modrinth:jade:eYz2YBGT"


}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_logo               : mod_logo,
            mod_display_url        : mod_display_url,
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// Task for testing the changelog feature
tasks.register('testChangelog') {
    description = 'Test the changelog parsing and output the latest section'
    group = 'verification'

    doLast {
        try {
            def changelogFile = rootProject.file('CHANGELOG.md')
            if (!changelogFile.exists()) {
                println "CHANGELOG.md not found at: ${changelogFile.absolutePath}"
                return
            }

            println "Reading changelog from: ${changelogFile.absolutePath}"
            def latestSection = readLatestChangelogSection(changelogFile)
            println "\n=== Latest Changelog Section ===\n"
            println latestSection
            println "\n=== End of Changelog Section ===\n"
        } catch (Exception e) {
            println "Error reading changelog: ${e.message}"
            e.printStackTrace()
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publisher {

    apiKeys {
        modrinth System.getenv("MODRINTH_API_TOKEN")
        curseforge System.getenv("CURSEFORGE_API_TOKEN")
        github System.getenv("GITHUB_TOKEN")
    }

    setDebug(false)
    setCurseID("1232978")
    setModrinthID("1vXRfEHZ")
    setVersionType("release")
    setChangelog(latestChangelogForPublisher)
    setVersion("1.21.1-${project.mod_version}")
    setDisplayName("Create: Mobile Packages 1.21.1-${project.mod_version}")
    setGameVersions("1.21.1")
    setLoaders("neoforge")
    setCurseEnvironment("both")
    setArtifact(jar.archiveFile.get() )
    setJavaVersions([JavaVersion.VERSION_21])

    modrinthDepends {
        required "create"
        optional "create_factory_logistics"
    }

    curseDepends {
        required "create"
        optional "create-factory-logistics"
        optional "create-fluidlogistic"
    }

    github {
        repo = "timplay33/Create-Mobile-Packages"
        tag = "1.21.1-${project.mod_version}"
        target = "mc1.21.1/main"
    }
}


apply from: 'gradle/neoforge-create.gradle'
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}
test { useJUnitPlatform() }

sourceSets.create('gameTest') {
    compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
}
neoForge {
    mods { "${mod_id}" { sourceSet sourceSets.gameTest } }
    runs.gameTestServer {
        sourceSet = sourceSets.gameTest
        gameDirectory = file('run-gametest')
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        jvmArguments.addAll('-Xmx2G', '-XX:ActiveProcessorCount=2')
    }
}
tasks.named('runGameTestServer') {
    def resultLog = file('run-gametest/logs/latest.log')
    doFirst { resultLog.delete() }
    doLast {
        def log = resultLog.exists() ? resultLog.getText('UTF-8') : ''
        if (!log.contains('18 tests are now running') || !log.contains('18 GAME TESTS COMPLETE') || !log.contains('All 18 required tests passed')) {
            throw new GradleException('Eleven actual CMP checks did not complete')
        }
    }
}

sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
}

// Opt-in isolated client/network checks; never packaged into the distributable JAR.
if (project.hasProperty('cmpClientCheck')) {
    sourceSets.create('clientCheck') {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    neoForge {
        mods { "${mod_id}" { sourceSet sourceSets.clientCheck } }
        runs.client {
            sourceSet = sourceSets.clientCheck
            gameDirectory = project.file('run-client-check')
            systemProperty 'dimensionworks.verifyCMP', 'true'
            jvmArguments.addAll('-Xmx2G', '-XX:ActiveProcessorCount=2')
            programArguments.addAll('--width', '1024', '--height', '600')
        }
    }
    tasks.named('runClient') {
        doLast {
            def log = file('run-client-check/logs/latest.log').getText('UTF-8')
            ['CMP CLIENT PACKED CHECK PASSED:', 'CMP CLIENT TRASH CHECK PASSED:', 'CMP CLIENT CHECK PASSED:'].each { marker ->
                if (!log.contains(marker)) throw new GradleException('Incomplete isolated client check: ' + marker)
            }
        }
    }
}

name: Build and Release DimensionWorks Fork

on:
  push:
    branches:
      - codex/dimensionworks-drone-logistics
      - mc1.20.1/main
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew clean build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/dimensionworks-drone-logistics'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: release

      - name: Update fixed GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MOD_VERSION=$(sed -n 's/^mod_version=//p' gradle.properties)
          TAG="1.20.1-${MOD_VERSION}"
          ASSET="create_mobile_packages-1.20.1-${MOD_VERSION}.jar"
          JAR=$(find release -type f -name "${ASSET}" | head -n 1)

          test -n "${MOD_VERSION}"
          test -n "${JAR}"

          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --target "${GITHUB_SHA}" --title "${TAG}" --generate-notes
          fi

          gh release upload "${TAG}" "${JAR}" --clobber
